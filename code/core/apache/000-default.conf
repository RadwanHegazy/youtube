<VirtualHost *:80>
    ServerName localhost

    # Define the WebSocket cluster
    <Proxy balancer://ws_cluster>
        BalancerMember ws://django1:8000 route=1
        BalancerMember ws://django2:8001 route=2
        BalancerMember ws://django3:8002 route=3
        ProxySet stickysession=ROUTEID lbmethod=byrequests
    </Proxy>

    # Define the HTTP cluster
    <Proxy balancer://http_cluster>
        BalancerMember http://django1:8000 route=1
        BalancerMember http://django2:8001 route=2
        BalancerMember http://django3:8002 route=3
        ProxySet stickysession=ROUTEID lbmethod=byrequests
    </Proxy>

    ProxyPreserveHost On
    ProxyRequests Off

    # WebSocket handling - must come first
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/ws/(.*) balancer://ws_cluster/ws/$1 [P,L]

    # API paths
    ProxyPass /api/ balancer://http_cluster/api/
    ProxyPassReverse /api/ balancer://http_cluster/api/

    # Default routing
    ProxyPass / balancer://http_cluster/
    ProxyPassReverse / balancer://http_cluster/

    # WebSocket specific proxy settings
    <Location /ws/>
        ProxyPass balancer://ws_cluster/ws/
        ProxyPassReverse balancer://ws_cluster/ws/
        ProxyAddHeaders Off
        RequestHeader unset Early-Data
        RequestHeader unset X-Forwarded-Proto
    </Location>

    <Proxy *>
        Require all granted
    </Proxy>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>