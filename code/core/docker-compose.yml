name: "Youtube"

services:
  db:
    image: mysql:8.0.40-debian
    container_name: mysql_db
    environment:
      MYSQL_DATABASE: yt_db
      MYSQL_USER: youtube_db_user
      MYSQL_PASSWORD: youtube123
      MYSQL_ROOT_PASSWORD: root
      
    volumes:
      - mysql_data:/var/lib/mysql
    # ports:
    #   - "3306:3306"
    networks:
      - myproject_network

  redis:
    image: redis:7.2
    container_name: redis_cache
    networks:
      - myproject_network

  django1:
    build: .
    container_name: django1_server
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - myproject_network
    # ports:
    #   - "8000:8000"
      
  django2:
    build: .
    container_name: django2_server
    command: python manage.py runserver 0.0.0.0:8001
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - myproject_network
  django3:
    build: .
    container_name: django3_server
    command: python manage.py runserver 0.0.0.0:8002
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - myproject_network

  celery:
    build: .
    command: celery -A core worker --pool=solo --loglevel=info
    container_name: celery_webworker
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - myproject_network

    
  apache:
    build: ./apache
    container_name: apache_loadbalancer
    ports:
      - "80:80"
    depends_on:
      - django1
      - django2
      - django3
    networks:
      - myproject_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - myproject_network
    # ports:
    #   - "9200:9200"

volumes:
  mysql_data:
  esdata:

networks:
  myproject_network:
    driver: bridge