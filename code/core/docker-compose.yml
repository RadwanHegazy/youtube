version: '3.8'

name: "Youtube"

services:
  db:
    image: mysql:8.0.40-debian
    container_name: mysql_db
    environment:
      MYSQL_DATABASE: yt_db
      MYSQL_USER: youtube_db_user
      MYSQL_PASSWORD: youtube123
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - myproject_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=root"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7.2
    container_name: redis_cache
    networks:
      - myproject_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  django1:
    build: .
    container_name: django1_server
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - myproject_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/__health_check__/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  django2:
    build: .
    container_name: django2_server
    command: python manage.py runserver 0.0.0.0:8001
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - myproject_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/__health_check__/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  django3:
    build: .
    container_name: django3_server
    command: python manage.py runserver 0.0.0.0:8002
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - myproject_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/__health_check__/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  celery:
    build: .
    command: celery -A core worker --pool=solo --loglevel=info
    container_name: celery_webworker
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - myproject_network
    healthcheck:
      test: ["CMD", "celery", "-A", "core", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  apache:
    build: ./apache
    container_name: apache_loadbalancer
    ports:
      - "80:80"
    depends_on:
      django1:
        condition: service_healthy
      django2:
        condition: service_healthy
      django3:
        condition: service_healthy
    networks:
      - myproject_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - myproject_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:
  esdata:

networks:
  myproject_network:
    driver: bridge